defaults:
  - model: sepformer
  - writer: separation_cometml
  - metrics: separation
  - datasets: separation
  - dataloader: example
  - _self_

data_dir: dla_dataset
sample_rate: 16000

dataloader:
  batch_size: 32

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.5e-4
  weight_decay: 1e-3

lr_scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: 5e-4
  pct_start: 0.1
  steps_per_epoch: ${trainer.epoch_len}
  epochs: ${trainer.n_epochs}
  anneal_strategy: cos
  cycle_momentum: false

loss_function:
  _target_: src.loss.PITSISNRLoss

transforms:
  batch_transforms:
    train: null
    inference: null

writer:
  run_name: sepformer

trainer:
  n_epochs: 100
  epoch_len: 625
  device: auto
  device_tensors: [mix, targets]
  seed: 42
  log_step: 50
  audio_examples: 2
  use_amp: true
  max_grad_norm: 5.0
  skip_oom: false
  lr_scheduler_metric: val_SI-SNRi
  monitor: "max val_SI-SNRi"
  early_stop: ${trainer.n_epochs}
  save_period: 5
  save_dir: saved
  resume_from: null
  from_pretrained: null
  override: false

hydra:
  job:
    chdir: false